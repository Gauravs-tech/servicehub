spring:
  application:
    name: servicehub

  datasource:
    url: jdbc:postgresql://localhost:5432/servicehub_db
    username: servicehub
    password: servicehub123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000}
  refresh-expiration: ${REFRESH_TOKEN_EXPIRATION:604800}

server:
  port: 8080